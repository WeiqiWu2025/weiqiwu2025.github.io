<ul class="project-list">
  {% for project in site.data.projects %}
    <li><a href="{{ project.url }}" target="_blank" rel="noreferrer"><strong>{{ project.name }}</strong></a>: Reproduction code for <a href="{{ project.paper_url }}" target="_blank" rel="noreferrer">“{{ project.paper_title }}”</a>.</li>
  {% endfor %}
</ul>
